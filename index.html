<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiet Japan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, serif; background: #1a1a1a; color: #e8e0d5; min-height: 100vh; }
  header { text-align: center; padding: 60px 20px 40px; border-bottom: 1px solid #333; }
  h1 { font-size: 2.8em; color: #e8e0d5; letter-spacing: 0.1em; margin-bottom: 8px; }
  .subtitle { color: #888; font-style: italic; font-size: 1.1em; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; padding: 40px 32px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 600px) { .gallery { grid-template-columns: 1fr; padding: 20px 16px; } }
  .photo-card { background: #242424; border-radius: 8px; overflow: hidden; }
  .photo-card img { width: 100%; display: block; aspect-ratio: 4/3; object-fit: cover; }
  .photo-info { padding: 14px 16px; }
  .location { font-size: 0.85em; color: #c9a96e; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
  .location::before { content: "📍 "; }
  .loading { text-align: center; padding: 80px 20px; color: #666; font-style: italic; }
  .empty { text-align: center; padding: 80px 20px; color: #555; }
  footer { text-align: center; padding: 40px; color: #444; font-size: 0.9em; border-top: 1px solid #222; margin-top: 20px; }
</style>
</head>
<body>
<header>
  <h1>Quiet Japan</h1>
  <p class="subtitle">Discovering the tranquil beauty of Japan</p>
</header>

<div class="gallery" id="gallery">
  <div class="loading">Loading photos...</div>
</div>

<footer>
  &copy; Quiet Japan — A photo journal of peaceful moments
</footer>

<script>
const REPO = 'ffuyuko78-cpu/-quiet-japan';
const FOLDER = 'photos';

function toLocation(filename) {
  return filename
    .replace(/\.[^.]+$/, '')
    .replace(/_/g, ' ')
    .replace(/-/g, ' ');
}

async function loadPhotos() {
  const gallery = document.getElementById('gallery');
  try {
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FOLDER}`);
    if (!res.ok) throw new Error('no photos yet');
    const files = await res.json();
    const images = files.filter(f => /\.(jpg|jpeg|png|gif|webp)$/i.test(f.name));
    if (images.length === 0) {
      gallery.innerHTML = '<div class="empty"><p>No photos yet.</p></div>';
      return;
    }
    gallery.innerHTML = images.map(f => `
      <div class="photo-card">
        <img src="${f.download_url}" alt="${f.name}" loading="lazy">
        <div class="photo-info">
          <div class="location">${toLocation(f.name)}</div>
        </div>
      </div>
    `).join('');
  } catch (e) {
    gallery.innerHTML = '<div class="empty"><p>No photos yet.</p></div>';
  }
}

loadPhotos();
</script>
</body>
</html>
