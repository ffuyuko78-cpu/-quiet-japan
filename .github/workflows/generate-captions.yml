name: Generate Photo Captions

on:
  push:
    paths:
      - 'photos/**'

jobs:
  caption:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate captions with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 << 'PYTHON'
          import os, json, base64, urllib.request

          photos_dir = "photos"
          captions_file = "captions.json"

          if os.path.exists(captions_file):
              with open(captions_file, "r") as f:
                  captions = json.load(f)
          else:
              captions = {}

          api_key = os.environ["GEMINI_API_KEY"]

          for fname in os.listdir(photos_dir):
              if not fname.lower().endswith((".jpg", ".jpeg", ".png", ".webp", ".gif")):
                  continue
              if fname in captions:
                  continue

              fpath = os.path.join(photos_dir, fname)
              with open(fpath, "rb") as f:
                  img_b64 = base64.b64encode(f.read()).decode()

              ext = fname.rsplit(".", 1)[-1].lower()
              mime = "image/jpeg" if ext in ("jpg","jpeg") else f"image/{ext}"

              prompt = (
                  "You are writing captions for a Japanese photography blog for international visitors. "
                  "Write a SHORT poetic English caption (1-2 sentences, max 20 words). "
                  "Focus on atmosphere and what makes it uniquely Japanese. "
                  "Do not mention people's names or exact addresses."
              )

              body = json.dumps({
                  "contents": [{"parts": [
                      {"text": prompt},
                      {"inline_data": {"mime_type": mime, "data": img_b64}}
                  ]}]
              }).encode()

              req = urllib.request.Request(
                  f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}",
                  data=body,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req) as res:
                      data = json.loads(res.read())
                      text = data["candidates"][0]["content"]["parts"][0]["text"].strip()
                      captions[fname] = {"caption": text, "status": "pending"}
                      print(f"OK {fname}: {text}")
              except Exception as e:
                  print(f"NG {fname}: {e}")

          with open(captions_file, "w", encoding="utf-8") as f:
              json.dump(captions, f, ensure_ascii=False, indent=2)
          PYTHON

      - name: Commit captions
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add captions.json
          git diff --cached --quiet || git commit -m "Auto-generate captions"
          git push
